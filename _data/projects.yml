- name: drupalgeddon2-cli
  kind: exploit / tooling
  url: https://github.com/nayem-m/drupalgeddon2-cli
  lang: Python
  desc: >-
    A command-line rewrite of the Drupalgeddon2 (CVE-2018-7600) proof of concept,
    built while working through HTB Academy's Attacking Common Applications.
    Auto-plants a web shell with a randomised name and parameter, and supports
    one-shot commands or an interactive pseudo-shell. For authorised testing only.
  tags: [CVE-2018-7600, RCE, HTB Academy]

- name: Fantasy Cyber League
  kind: phishing simulation
